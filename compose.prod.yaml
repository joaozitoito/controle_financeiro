# Produção local: docker compose -f compose.prod.yaml up --build
# Site em http://localhost:8080, API em http://localhost:3001. Banco separado do dev.
name: meusaldo-prod

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: meusaldo
      POSTGRES_DB: meusaldo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes: ["dados:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "meusaldo", "-d", "meusaldo"]
      interval: 3s
      retries: 20

  # Aplica as migrações uma vez e termina; a imagem prod não leva o CLI do Prisma.
  migrate:
    build: { context: ../backend_meusaldo, target: build }
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://meusaldo:${POSTGRES_PASSWORD}@db:5432/meusaldo?schema=public
    depends_on:
      db: { condition: service_healthy }

  api:
    build: { context: ../backend_meusaldo, target: prod }
    restart: unless-stopped
    ports: ["3001:3001"]
    environment:
      DATABASE_URL: postgresql://meusaldo:${POSTGRES_PASSWORD}@db:5432/meusaldo?schema=public
      CORS_ORIGINS: http://localhost:8080
    healthcheck:
      # A base slim não tem curl; o fetch do Node faz a checagem.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      retries: 10
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: ./meusaldo
      target: prod
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    restart: unless-stopped
    ports: ["8080:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  dados:
